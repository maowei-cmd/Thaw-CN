name: Build

on:
  workflow_dispatch:
  push:
    branches: [development]
  pull_request:
    branches: [development]

permissions:
  contents: read

jobs:
  build:
    # GitHub-hosted Xcode 27 image, the same label the upstream project uses.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install SwiftLint
        run: |
          sh scripts/install-swiftlint.sh "$HOME/.local/bin"
          sudo mkdir -p /opt/homebrew/bin
          sudo ln -sf "$HOME/.local/bin/swiftlint" /opt/homebrew/bin/swiftlint

      - name: Build the app
        run: |
          xcodebuild -project Thaw.xcodeproj -scheme Thaw -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package the debug app
        run: |
          APP=$(xcodebuild -project Thaw.xcodeproj -scheme Thaw -configuration Debug -showBuildSettings -json \
            | python3 -c 'import json,sys,os; s=json.load(sys.stdin)[0]["buildSettings"]; print(os.path.join(s["TARGET_BUILD_DIR"], s["WRAPPER_NAME"]))')
          echo "APP=$APP"
          codesign --force --deep --sign - "$APP" || true
          ditto -c -k --keepParent "$APP" Thaw-debug.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Thaw-debug
          path: Thaw-debug.zip
          retention-days: 14

      - name: Test pure packages
        run: |
          for package in MenuBarModel ThawAX ThawLayout ThawCapture ThawExtras ThawConcurrency ThawUI; do
            swift test --package-path "$package"
          done
